aid: arthur-online
url: https://raw.githubusercontent.com/api-evangelist/arthur-online/refs/heads/main/apis.yml
name: Arthur Online
kind: company
description: 'Arthur Online is a London-headquartered UK property management software platform, founded
  in 2008 and acquired by Aareon in January 2021, that gives letting agents, self-managing landlords,
  block and social housing managers, and student accommodation operators a cloud system of record for
  properties, units, tenancies, tenants, applicants, viewings, maintenance work orders, certificates,
  utilities and rental financials, with companion mobile apps for managers, tenants, contractors and
  owners. It sits in the middle of the UK residential lettings value chain: it is the agency-side operational
  system that pushes stock out to the Rightmove and Zoopla portals and pulls accounting into Xero and
  QuickBooks, rather than a listings marketplace or a data cooperative. Its API posture is unusually
  open for the sector but is not open data: the full Arthur API v2 reference is published without a
  login as a public Postman collection at developer.arthuronline.co.uk covering 324 documented requests
  across 16 resource areas, yet every call is tenant-scoped OAuth 2.0 Authorization Code plus an X-EntityID
  header, credentials are issued only from inside a paying Arthur account after contacting Arthur support,
  and no data is readable anonymously. There is no RESO posture at all — the United Kingdom has no MLS,
  no NAR, and no RESO Data Dictionary or Web API certification regime, so listings interoperability
  here is portal-to-CRM feeds rather than a certified machine-readable standard.'
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/arthur-online.png
tags:
- Real Estate
- United Kingdom
- Property Management
- PropTech
- Rentals
- Lettings
- Tenancy
