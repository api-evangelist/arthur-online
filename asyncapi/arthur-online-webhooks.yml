method: searched
source:
- https://developer.arthuronline.co.uk/ (Arthur API public Postman collection, Webhook > Useful Information > Triggers)
- https://github.com/arthur-crm/webhookPayloadTemplates
description: 'Arthur Online''s webhook catalogue: 125 subscribable triggers across 30 domain models. Subscriptions
  are created in the Arthur UI (Webhook page > Subscribe New Webhook), not through the API - there is no webhook
  management endpoint in the Arthur API v2.'
subscription:
  self_serve: true
  managed_in: Arthur web app > Webhook page
  api_managed: false
  steps:
  - Go to the webhook page in Arthur.
  - Click "Subscribe New Webhook".
  - Select the event to subscribe to and enter your webhook URL.
  - Click "Save Changes".
delivery:
  method: POST
  content_type: application/x-www-form-urlencoded
  user_agent: CakePHP
  headers_template: examples/webhooks/arthur-online-header.json
  signature: null
  signature_note: Arthur publishes no webhook signing secret or signature header; the documented headers carry no
    authenticity proof.
  retries: null
  logs: Webhook page > View Logs shows every triggered delivery with timestamp, status and server response.
  testing_tool: https://pipedream.com/requestbin (recommended by Arthur for inspecting deliveries)
envelope:
  event:
  - alias
  - name
  - created
  - sent
  webhook:
  - id
  - url
  - status
  - event_alias
  - subscribe_url
  - unsubscribe_url
  - delete_url
  data: flat string map of the changed record; dotted keys for related models
asyncapi: asyncapi/arthur-online-webhooks-asyncapi.yml
event_count: 125
model_count: 30
