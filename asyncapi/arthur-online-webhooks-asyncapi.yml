components:
  messages:
    accesskeyAccessKeysIndividualExpired:
      name: Access Keys (Individual) Expired
      title: 'AccessKey: Access Keys (Individual) Expired'
      summary: Arthur fires this webhook when the AccessKey event "Access Keys (Individual) Expired" occurs in the
        subscribed entity.
      contentType: application/x-www-form-urlencoded
      payload:
        $ref: '#/components/schemas/WebhookEnvelope'
      x-arthur-model: AccessKey
    applicantApplicantAddedViaMiddleware:
      name: Applicant added via Middleware
      title: 'Applicant: Applicant added via Middleware'
      summary: Arthur fires this webhook when the Applicant event "Applicant added via Middleware" occurs in the
        subscribed entity.
      contentType: application/x-www-form-urlencoded
      payload:
        $ref: '#/components/schemas/WebhookEnvelope'
      x-arthur-model: Applicant
      x-arthur-event-alias: applicant-added-external
      externalDocs:
        description: Official payload template
