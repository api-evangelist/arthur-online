asyncapi: 3.0.0
info:
  title: Arthur Online Webhooks
  version: 1.0.0
  description: The Arthur Online webhook event surface. A property manager subscribes a webhook URL to one or more
    of the 125 published triggers on the Arthur webhook page; Arthur then POSTs a form-encoded payload to that URL
    each time the corresponding event fires in the entity. Derived verbatim from the provider's published trigger
    table in the public Arthur API Postman collection (https://developer.arthuronline.co.uk/) and the official payload
    templates at https://github.com/arthur-crm/webhookPayloadTemplates. Arthur publishes no AsyncAPI of its own;
    this document is the API Evangelist rendering of that published surface.
  contact:
    name: Arthur Online Support
    url: https://support.arthuronline.co.uk/
  x-derived-from:
  - collections/arthur-online.postman_collection.json
  - https://github.com/arthur-crm/webhookPayloadTemplates
  x-derived-date: '2026-07-26'
defaultContentType: application/x-www-form-urlencoded
servers:
  subscriber:
    host: your-webhook-endpoint.example.com
    protocol: https
    description: The subscriber-supplied HTTPS endpoint registered on the Arthur webhook page. Arthur is the publisher;
      the integrator's server is the subscriber.
channels:
  arthurWebhook:
    address: /
    title: Arthur webhook delivery
    description: Arthur POSTs every subscribed event to the single webhook URL registered for that event. Delivery
      attempts, timestamps, status and server response are recorded in the webhook logs in the Arthur UI (View logs).
