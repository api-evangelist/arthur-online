  schemas:
    WebhookEnvelope:
      type: object
      description: Every Arthur webhook delivery carries the same three-part envelope.
      required:
      - event
      - webhook
      - data
      properties:
        event:
          type: object
          properties:
            alias:
              type: string
              description: Machine name of the event, e.g. viewing-offer.
            name:
              type: string
              description: Human name of the event as shown on the webhook page.
            created:
              type: string
              description: When the event occurred.
            sent:
              type: string
              description: When Arthur dispatched the delivery.
        webhook:
          type: object
          properties:
            id:
              type: string
            url:
              type: string
              description: The subscribed endpoint.
            status:
              type: string
              example: subscribed
            event_alias:
              type: string
            subscribe_url:
              type: string
            unsubscribe_url:
              type: string
            delete_url:
              type: string
        data:
          type: object
          description: Flat map of the changed record. Keys are Arthur field names, dotted where they cross a related
            model (Profile.first_name, unit.postcode, Unit.OwnerEntity.id). All values are delivered as strings.
            The exact key set differs per event - see the payload templates in examples/webhooks/.
          additionalProperties:
            type: string
