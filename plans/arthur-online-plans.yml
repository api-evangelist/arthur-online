    price: 82.50
    currency: GBP
    period: month
    included_units: 55
    price_per_unit: 1.50
    api_access: true
    shared_screen_sessions_included: 0
    features:
      - Unlimited storage
      - Maintenance module
      - Finance module
      - Compliance tracking
  - name: Professional
    price: 96.00
    currency: GBP
    period: month
    included_units: 60
    price_per_unit: 1.60
    api_access: true
    shared_screen_sessions_included: 1
    features:
      - Unlimited storage
      - Maintenance module
      - Finance module
      - Compliance tracking
