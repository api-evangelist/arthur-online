source: https://www.arthuronline.co.uk/pricing
description: >-
  Arthur is sold as seat-and-unit priced property management software, not as an API product.
  The API carries no separate price, no metered tier and no free developer tier - it is included
  with every plan ("use our API to integrate your systems with Arthur at no extra cost"), but is
  only reachable from inside a paying account after Arthur support grants access. Billing is
  annual, by direct debit or card, with invoicing available to high-volume Enterprise customers.
currency: GBP
billing_period: month (billed annually)
api_access: included in all plans; credentials issued by Arthur support on request
api_metering: none published
plans:
