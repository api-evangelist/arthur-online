companyFacts:
  headquarters: London, United Kingdom
  founded: 2008
  ownership: >-
    Acquired by Aareon (European property-industry ERP and digital solutions provider) in
    January 2021.
  acquisitions: Acquired Tilt Property Software in July 2021.
  segments:
    - Letting agents
    - Self-managing landlords
    - Student housing
    - Social housing
    - Block management
  keyIntegrations:
    - Xero
    - QuickBooks
    - Zoopla
    - Rightmove
    - Fixflo
    - Signable
    - TransUnion

findings:
  summary: >-
    Arthur Online is a rare thing in this sector study: a property organization with a
    genuinely public, complete, machine-readable API reference that anyone can read without an
    account — and simultaneously an API that no one can call without a paid subscription and a
    support conversation. Documentation openness and data openness are separate axes and
    Arthur splits them cleanly. It is also a clean demonstration of the UK market seam: with no
    MLS and no NAR, there is no RESO certification to certify and no cooperative contract to
    reach; the machine-readable listings standard simply does not exist in this jurisdiction,
    and portal syndication to Rightmove and Zoopla happens as bilateral vendor integration
    that never surfaces as a documented API resource. The open property data in the UK lives in
    government (HM Land Registry, Ordnance Survey), not in the private stack.
  gaps:
    - No OpenAPI or any other formal API description; the Postman collection is the contract.
    - No documented OAuth scopes — consent appears to be all-or-nothing.
    - No webhook payload signing or shared secret documented.
    - No official SDKs; GitHub org is empty.
    - No public status page (status subdomain returns 503).
    - No self-serve sandbox or trial credentials; access requires contacting support.
    - Legacy apidocs.arthuronline.co.uk host is dead but still cited by third parties.

