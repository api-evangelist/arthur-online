                    id: 599238
                    address: Unit 2 - B, 5 marford close, northwich, Cheshire, CW9 8WW
                  tenancy:
                    id: 709960
                    ref: TE1197
                    address: Unit 2 - B, 5 marford close, northwich, Cheshire, CW9 8WW
                  notes: Fully assessed
                  share_manager: true
                  share_tenant: false
                  share_contractor: false
