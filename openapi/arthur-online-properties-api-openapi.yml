          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addProperty
      summary: Add Property
      tags:
      - Properties
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - name: strict
        in: query
        required: false
        schema:
          type: string
        description: Any simple fields that cannot be found will return a validation error, instead of creating a new value. E.g. source
        example: 'true'
      description: "Use this endpoint to create a new property. The API will return the saved data and a unique Property ID.\n\nSupported Fields \n The following fields are supported for the request body\n\nField \n Example \n Type \n Required? \n\nproperty_type \n Residential \n String \n No \n\nref \n My big property \n String \n Yes \n\naddress_line_1 \n Arthur House \n String \n Yes \n\naddress_line_2 \n 123 Property Street \n String \n No \n\ncity \n Stevenage \n String \n No \n\ncounty \n Hertfordshire \n String \n No \n\ncountry \n United Kingdom \n String \n No \n\narea \n South East \n Simple \n No \n\npostcode \n AB1 2CD \n String \n No \n\nletting_agent_id \n 4567 \n Integer \n No \n\nproperty_owner_id \n 5678 \n Integer \n Yes \n\nmax_occupancy \n 4 \n String \n No \n\nbathrooms \n 2 \n String \n No \n\nfloors \n 2 \n String \n No \n\nbedrooms \n 3 \n String \n No \n\nreceptions \n 1 \n String \n No \n\nsmart_meters \n 1 \n String \n No \n\ncouncil_tax_band \n B \n String \n No \n\ncouncil_account_no \n ABC123 \n String \n No \n\ncouncil_id \n 6789 \n Integer \n No \n\nportal_market_rent \n 850.00 \n Float \n No \n\nportal_market_rent_frequency \n Weekly \n String \n No \n\nfeatures \n [ \"Internet\", \"Fireplace\", \"Smart home integration\" ] \n Array (String) \n No \n\ntags \n [ \"Cheap Rent\" ] \n Array (String) \n No \n\ni_manage_this \n true \n Boolean \n No"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                property_type:
                  type: string
                  example: Residential
                ref:
                  type: string
                  example: My big property
                address_line_1:
                  type: string
                  example: Arthur House
                address_line_2:
                  type: string
                  example: 123 Property Street
                city:
                  type: string
                  example: Stevenage
                county:
                  type: string
                  example: Hertfordshire
                country:
                  type: string
                  example: United Kingdom
                area:
                  type: string
                  example: South East
                postcode:
                  type: string
                  example: AB1 2CD
                letting_agent_id:
                  type: integer
                  example: 4567
                property_owner_id:
                  type: integer
                  example: 5678
                max_occupancy:
                  type: string
                  example: '4'
                bathrooms:
                  type: string
                  example: '2'
                floors:
                  type: string
                  example: '2'
                bedrooms:
                  type: string
                  example: '3'
                receptions:
                  type: string
                  example: '1'
                smart_meters:
                  type: string
                  example: '1'
                council_tax_band:
                  type: string
                  example: B
                council_account_no:
                  type: string
                  example: ABC123
                council_id:
                  type: integer
                  example: 6789
                portal_market_rent:
                  type: number
                  example: 850.0
                portal_market_rent_frequency:
                  type: string
                  example: Weekly
                features:
                  type: array
                  items:
                    type: string
                  example: '[ "Internet", "Fireplace", "Smart home integration" ]'
                tags:
                  type: array
                  items:
                    type: string
                  example: '[ "Cheap Rent" ]'
                i_manage_this:
                  type: boolean
                  example: true
              required:
              - ref
              - address_line_1
              - property_owner_id
            example:
              property_type: Residential
              ref: My big property
              address_line_1: Arthur House
              address_line_2: 123 Property Street
              city: Stevenage
              county: Hertfordshire
              country: United Kingdom
              area: South East
              postcode: AB1 2CD
              letting_agent_id: 49470
              property_owner_id: 265389
              max_occupancy: '4'
              bathrooms: '2'
              floors: '2'
              bedrooms: '3'
              receptions: '1'
              smart_meters: '0'
              council_tax_band: B
              council_account_no: ABC123
              council_id: 33624
              portal_market_rent: 850.0
              portal_market_rent_frequency: Weekly
              features:
              - Internet
              - Fireplace
              - Smart home integration
              tags:
              - Cheap Rent
              i_manage_this: true
      responses:
        '200':
          description: The request was completed successfully without errors.
          content:
