openapi: 3.2.0
info:
  title: Arthur Properties API
  version: 2.0.0
  description: Arthur Properties API - the properties surface of the Arthur API v2, the UK property management platform from Arthur Online (an Aareon company). Derived operation-for-operation from the provider's public Postman Documenter collection at https://developer.arthuronline.co.uk/. Every request is scoped to an Arthur entity via the mandatory X-EntityID header and authorised with an OAuth 2.0 Authorization Code access token.
  contact:
    name: Arthur Online API Support
    url: https://support.arthuronline.co.uk/
  termsOfService: https://www.arthuronline.co.uk/terms-and-conditions/
  x-derived-from: collections/arthur-online.postman_collection.json
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-date: '2026-07-26'
servers:
- url: https://api.arthuronline.co.uk/v2
  description: Arthur API v2 production
security:
- arthurOAuth: []
tags:
- name: Properties
paths:
  /properties:
    get:
      operationId: listProperties
      summary: List Properties
      tags:
      - Properties
      parameters:
      - $ref: '#/components/parameters/EntityId'
      - name: full_address
        in: query
        required: false
        schema:
          type: string
        description: Filter by the full address of the property
      - name: address_1
        in: query
        required: false
        schema:
          type: string
        description: Filter by the address 1 field of the property
      - name: address_2
        in: query
        required: false
        schema:
          type: string
        description: Filter by the address 2 field of the property
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: Filter by the city of the property
      - name: county
        in: query
        required: false
        schema:
          type: string
        description: Filter by the county of the property
      - name: area_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by the area ID of the property
      - name: postcode
        in: query
        required: false
        schema:
          type: string
        description: Filter by the postcode of the property
      - name: property_type
        in: query
        required: false
        schema:
          type: string
        description: Use this parameter to filter by the type of property
      - name: rentable_units
        in: query
        required: false
        schema:
          type: string
        description: Filter based on the number of units available for rent
      - name: unit_status
        in: query
        required: false
        schema:
          type: string
        description: Filter based on the current status of units, including Available To Let, Under Offer, Let, and Unavailable to Let
      - name: tags
        in: query
        required: false
        schema:
          type: string
        description: Filter by tags associated with the property, which should be provided as a comma-separated list
      - name: i_manage_this
        in: query
        required: false
        schema:
          type: string
        description: Filter based on the management status of the property (boolean)
      - name: letting_agent_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by the ID of the letting agent associated with the property
      - name: property_owner_id
        in: query
        required: false
        schema:
          type: string
        description: Filter by the ID of the owner of the property
      - name: _q
        in: query
        required: false
        schema:
          type: string
        description: Filter by keyword
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Sort'
      - $ref: '#/components/parameters/Direction'
      description: 'This retrieves a list of properties.


        See available filters below to customize the list of properties returned.'
      responses:
        '200':
          description: The request was completed successfully without errors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                  pagination:
                    $ref: '#/components/schemas/Pagination'
              example:
                status: 200
                data:
                - id: 121619
                  property_type: Residential Block
                  property_description: multi
                  ref: reference
                  full_address: full address
                  address_line_1: address line 1
                  address_line_2: address line 2
                  city: city
                  county: ''
                  country: country
                  area: ''
                  postcode: postcode
                  total_units: 3
                  rentable_units: 0
                  letting_agent_id: null
                  property_owner_id: 123
                  property_owner_full_name: New Company
                  max_occupancy: N/A
                  bathrooms: N/A
                  floors: ''
                  bedrooms: N/A
                  receptions: N/A
                  smart_meters: ''
                  council_tax_band: N/A
                  council_account_no: ''
                  council_id: null
                  portal_market_rent: 0
                  portal_market_rent_frequency: ''
                  main_image_url: null
                  epc_urls: []
                  floor_plan_urls: []
                  thumbnail_urls: []
                  image_urls: []
                  features: []
                  property_features: []
                  additional_features: []
                  tags: []
                  notes: []
                  i_manage_this: true
                  latitude: null
                  longitude: null
                  custom_fields: []
                  modified: '2021-01-19T11:35:10+00:00'
                  created: '2021-01-19T11:35:10+00:00'
                pagination:
                  page: 1
                  current: 1
                  count: 1
                  pageCount: 1
                  limit: 20
