tenancy_header:
  name: X-EntityID
  required: true
  description: >-
    The Arthur entity (account) the call is scoped to. Every request must carry it, including
    reads. Records are only addressable inside their entity; an id from another entity returns 404.
  discovery: 'GET /entities (operationId listEntities) returns the entities a token can address.'

onboarding:
  self_serve: false
  steps:
    - Be an authorised user inside a paying Arthur account.
    - Contact Arthur support to be granted API access (https://support.arthuronline.co.uk/support/home).
    - In Arthur go to Settings > Your Account > OAuth Applications > Add Application.
    - Supply name, description, website and an HTTPS callback URL.
    - Arthur issues a client id and client secret.
  signup_page: https://www.arthuronline.co.uk/connect/arthur-api

token_lifecycle:
  authorization_code_ttl: 15 minutes
  access_token_ttl: 14 days
  refresh_token_ttl: 21 days
  token_request_encoding: application/x-www-form-urlencoded
  grants: [authorization_code, refresh_token]
  expiry_error:
    status: 401
    body: '{"error": "expired_token", "message": "This token has expired."}'

scopes:
  published: false
  note: >-
    Arthur publishes no OAuth scopes. A token carries whatever the authorising Arthur user can see.
    The real access control is organisational: Arthur recommends creating a separate Manager account
    for third-party developers, and Enterprise accounts can set per-Manager permissions to narrow
    what an integration can reach.

discovery:
  openid_configuration: 'https://auth.arthuronline.co.uk/.well-known/openid-configuration - 404 (probed 2026-07-26)'
  oauth_authorization_server: 'https://auth.arthuronline.co.uk/.well-known/oauth-authorization-server - 404 (probed 2026-07-26)'

token_handling_guidance:
  source: Arthur API collection > Useful Information > Security > Securing API Tokens
  practices:
    - Establish a system for rotating passwords and tokens.
    - Encrypt sensitive data and avoid decrypting it early in the process.
    - Store user access tokens in a secure, encrypted location.
    - Regenerate keys and tokens on any suspicion of compromise.

