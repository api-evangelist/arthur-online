description: >-
  Arthur API v2 uses a single security model: OAuth 2.0 Authorization Code with a bearer access
  token, plus a mandatory X-EntityID header naming the Arthur account the call is scoped to.
  There are no API keys, no scopes and no client-credentials flow. Credentials are not self-serve -
  a developer must be inside a paying Arthur account and ask Arthur support for API access before
  an OAuth application can be registered.

summary:
  types: [oauth2]
  oauth2_flows: [authorizationCode]
  api_key_in: []
  scopes_published: false
  mandatory_headers: [Authorization, X-EntityID]

schemes:
  - name: arthurOAuth
    type: oauth2
    description: >-
      OAuth 2.0 Authorization Code flow (RFC 6749 section 4.1), cited explicitly in the Arthur
      documentation. Access tokens last 14 days, refresh tokens 21 days, authorization codes 15 minutes.
    flows:
      - flow: authorizationCode
        authorizationUrl: https://auth.arthuronline.co.uk/oauth/authorize
        tokenUrl: https://auth.arthuronline.co.uk/oauth/token
