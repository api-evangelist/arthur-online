  hosting: Amazon Web Services co-located servers
  backups: Hourly on some servers, six-hourly on others, via AWS Backup.
  recovery_targets:
    database_recovery: 45 minutes
    core_systems_rebuild_plus_recovery: up to 3 hours
    secondary_systems: up to 12 hours
  customer_export: Settings > Back up my data exports CSV (property, unit, tenancy, tenant, owner, contractor, inventory, certificate dates, viewings, work orders); documents download separately.
  retention_after_cancellation: Data removed on written request from the account main contact; otherwise retained five years (GDPR).

