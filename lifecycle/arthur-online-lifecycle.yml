method: searched
source: >-
  https://developer.arthuronline.co.uk/ (Arthur API public Postman collection),
  https://www.arthuronline.co.uk/legal/fair-usage-policy,
  https://support.arthuronline.co.uk/support/solutions/articles/202000052217-api-work-providing-support,
  plus live probes of status.arthuronline.co.uk and arthuronline.freshstatus.io on 2026-07-26.
description: >-
  Arthur runs a single, uniformly-versioned API (v2) with no published change log, no
  deprecation policy, no status page and no API SLA. The lifecycle contract that does exist
  is commercial rather than technical: broken endpoints are fixed free of charge, new
  endpoints are quoted at an hourly rate, and support timeliness is governed by a Fair Usage
  Policy rather than an uptime commitment.

