name: Arthur Online
generated: '2026-07-26'
method: derived
source: openapi/arthur-online-types-openapi.yml, derived from the Arthur API public Postman collection
description: 'Arthur''s controlled vocabulary is machine-readable: every enumerated field in the platform resolves
  against the read-only Types API, 39 GET endpoints that serve the allowed values for applicant statuses, asset
  types, certificate types, contract types, area types and the rest. This artifact indexes those vocabularies plus
  the core domain terms of UK lettings that the API models.'
version: '2.0'
created: '2026-07-26'
modified: '2026-07-26'
tags:
- Real Estate
- Property Management
- Lettings
- United Kingdom
- Reference Data
reference_data_api:
  base: https://api.arthuronline.co.uk/v2
  endpoint_count: 39
  access: OAuth 2.0 bearer token + X-EntityID header; not anonymously readable.
core_terms:
- term: Entity
  definition: The Arthur account boundary. Every API call names an entity in the mandatory X-EntityID header, and
    records are only visible within their entity.
  category: Core Object
- term: Property
  definition: 'A building or address record. Everything else in Arthur hangs off a property: units, assets, certificates,
    tasks, work orders, utilities and transactions.'
  category: Core Object
- term: Unit
  definition: An individually lettable space beneath a property - a flat, a room, a commercial suite. Tenancies
    and viewings attach to units, not to properties.
  category: Core Object
- term: Tenancy
  definition: The agreement over a unit for a period, carrying the tenants on it, the deposit registration, recurring
    charges and the rent review history.
  category: Core Object
- term: Tenant
  definition: A person record occupying a unit under a tenancy; can be invited into the Arthur tenant portal.
  category: Core Object
- term: Applicant
  definition: A prospective renter moving through the lettings funnel, with a status, credit checks and assigned
    managers, before converting into a tenancy.
  category: Core Object
- term: Viewing
  definition: A scheduled appointment to view a property or unit, with applicants attached, an optional offer, and
    its own status lifecycle.
  category: Core Object
- term: Task
  definition: A unit of maintenance or management work. Tasks carry subtasks and can be escalated into work orders.
  category: Core Object
- term: Work order
  definition: Contractor-facing work dispatched from a task, with quotes, invoices, approvals and a completion workflow
    across manager, owner and contractor.
  category: Core Object
- term: Certificate
  definition: A compliance document with an expiry - gas safety, electrical, EPC. Expiry drives webhook events at
    30 days, 7 days and on the day.
  category: Core Object
- term: Simple type
  definition: An id/name pair the user can extend (for example 'source'). Submitting an unknown name creates it
    unless strict=true is set.
  category: Convention
- term: Custom field
  definition: A tenant-defined field on properties, units, tenancies, applicants and tenants, read as an array of
    {name, api_name, value} and written as an api_name-keyed object.
  category: Convention
- term: Recurring
  definition: A scheduled charge on a tenancy - rent and other repeating amounts - which generates transactions.
  category: Core Object
- term: Transaction
  definition: A financial movement on a tenancy or property, settled against invoices and payoffs, and remitted
    to property owners.
  category: Core Object
